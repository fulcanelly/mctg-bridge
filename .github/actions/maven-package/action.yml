name: Maven package
description: Set up Java, cache Maven dependencies, and package the project

inputs:
  revision:
    description: Maven project version to build
    required: false
    default: ''

runs:
  using: composite

  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin

    - name: Cache local Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build
      shell: bash
      env:
        MAVEN_REVISION: ${{ inputs.revision }}
      run: |
        if [[ -n "$MAVEN_REVISION" ]]; then
          mvn package "-Drevision=$MAVEN_REVISION"
        else
          mvn package
        fi
