name: Release

# to trigger release do:
# git tag vX.X.X
# git push
# git push --tags

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag version
        shell: bash
        run: bash .github/scripts/validate-tag-version.sh "$GITHUB_REF_NAME"

      - name: Build with Maven
        uses: ./.github/actions/maven-package

      - name: Create release + upload
        run: gh release create "$GITHUB_REF_NAME" target/tg-bridge-*.jar --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
